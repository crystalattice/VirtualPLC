version: '3.8'
services:
    # Main Fuel Farm service
    fuel_farm:
    build: .
    command: "Models/FuelFarm/components.py"
    networks:
      - fuel-network

    # Tank services
    tank1:
        build: .
        command: "PipingSystems/tank/tank.py"
        networks:
          - fuel-network

